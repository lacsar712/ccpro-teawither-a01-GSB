{% extends "base.html" %}
{% block title %}删除节拍账{% endblock %}
{% block content %}
<div class="page-header">
  <h1>删除翻堆节拍账</h1>
</div>
<div class="card">
  <p>确认删除节拍账「{{ object }}」？</p>
  <form method="post" class="actions">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">确认删除</button>
    <a class="btn btn-secondary" href="{% url 'turn_list' %}">取消</a>
  </form>
</div>
{% endblock %}
