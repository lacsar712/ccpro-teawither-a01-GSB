{% extends "base.html" %}
{% block title %}新建翻堆节拍账{% endblock %}
{% block content %}
<div class="page-header">
  <h1>新建翻堆节拍账</h1>
  <a class="btn btn-secondary" href="{% url 'turn_list' %}">返回列表</a>
</div>
<div class="card">
  <form method="post" class="form-grid">
    {% csrf_token %}
    {% for field in form %}
    <div class="form-row">
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {{ field.errors }}
    </div>
    {% endfor %}
    {{ form.non_field_errors }}
    <p class="muted">仅「萎凋中」的槽位可建账；翻堆序号在同槽内自动从 1 起递增，且唯一。</p>
    <button class="btn" type="submit">建账</button>
  </form>
</div>
{% endblock %}
