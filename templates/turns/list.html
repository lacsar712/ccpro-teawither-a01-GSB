{% extends "base.html" %}
{% block title %}翻堆节拍{% endblock %}
{% block content %}
<div class="page-header">
  <h1>翻堆节拍账</h1>
  <div class="actions">
    <button class="btn btn-secondary btn-sm"
            hx-get="{% url 'turn_list' %}"
            hx-target="#turn-table"
            hx-swap="innerHTML">刷新列表</button>
    <a class="btn" href="{% url 'turn_create' %}">新建节拍账</a>
  </div>
</div>
<div class="card" id="turn-table">
  {% include "turns/_table.html" %}
</div>
{% endblock %}
